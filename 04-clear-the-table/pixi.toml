[workspace]
name = "clear-the-table"
version = "0.1.0"
description = "Problem 4: the arm's own camera, and a table marked when the clock stops"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# The libraries the learned solutions need are pinned exactly as problem 3
# pins them: the two problems are meant to be compared, and a comparison
# between two versions of the same borrowed model would measure the versions.
[dependencies]
python = "3.12.*"
numpy = ">=2.0,<2.3"
# rack/layout.py imports OpenCV, and the glass zone is read from there.
py-opencv = ">=4.9,<4.14"
# The pictures in docs/, which read the examiner's data, and the runs' pictures.
matplotlib = ">=3.8"
pytest = ">=7"
ruff = ">=0.4"
# Solution 2 orders its pushes with problem 3's fitted trees, which are
# gradient-boosted trees, so the library that defines them has to be here to
# load the fitted file.
scikit-learn = ">=1.4"
# The learned solutions. Every pin below is problem 3's own, for the reason in
# the comment above the dependency list.
pytorch = ">=2.7,<2.12"
setuptools = "<81"
packaging = "<26"
fsspec = "<=2026.2.0"
av = ">=15,<16"
# SmolVLA's picture processor, in transformers, imports scipy without listing it.
scipy = ">=1.14"

[pypi-dependencies]
# The physics engine the pushes happen in, the same one problem 3 uses.
mujoco = ">=3.3"
# Where SmolVLA comes from, as in problem 3, and the library that fits a small
# correction to it.
lerobot = { version = ">=0.6,<0.7", extras = ["smolvla", "dataset"] }
peft = ">=0.17,<0.22"

[activation.env]
# The problem folder, so that ``examiner`` and ``shared`` are packages; this
# problem's copy of the cell's modules; the six solution folders, whose names
# start with a digit and so are put on the path one by one; and the copy of
# problem 3's common files that the examiner is built on. Problem 3's files are
# copied into from-problem-3/ rather than imported from problem 3's folder, so
# that each problem stands on its own.
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/work-cell:$PIXI_PROJECT_ROOT/01-geometry-reference:$PIXI_PROJECT_ROOT/02-geometry-ranked:$PIXI_PROJECT_ROOT/03-imitation:$PIXI_PROJECT_ROOT/04-world-model:$PIXI_PROJECT_ROOT/05-reinforcement-learning:$PIXI_PROJECT_ROOT/06-smolvla-fine-tuned:$PIXI_PROJECT_ROOT/from-problem-3/bench"

[tasks]
