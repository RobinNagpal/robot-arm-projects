# Gazebo and ROS speak different message formats, so every topic that has to
# cross between them is listed here. Everything is one way, out of Gazebo.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/image"
  gz_topic_name: "/wrist_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/depth_image"
  gz_topic_name: "/wrist_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# The segmentation camera publishes its label image under <topic>/labels_map.
- ros_topic_name: "/wrist_camera/segmentation"
  gz_topic_name: "/wrist_camera/segmentation/labels_map"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/camera_info"
  gz_topic_name: "/wrist_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# A contact sensor ignores the <topic> given in the model and always publishes
# under its own full path, so those paths are what have to be named here. The
# sensors are on the silicone pads rather than on the fingers behind them,
# because the pads are what actually touch a glass.
#
# Both pads report onto the one ROS topic. The task only asks whether anything
# is touching, and the two moments it asks are the pads meeting a glass and a
# glass rim meeting the rack, neither of which is a question about sides.
- ros_topic_name: "/fingertip_contacts"
  gz_topic_name: "/world/work_cell/model/work_cell/link/left_pad/sensor/left_pad_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/fingertip_contacts"
  gz_topic_name: "/world/work_cell/model/work_cell/link/right_pad/sensor/right_pad_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
