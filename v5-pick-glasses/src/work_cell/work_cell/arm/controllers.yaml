# The controllers ros2_control loads inside Gazebo.
#
# The arm uses one trajectory controller: it takes joint positions with times
# against them and interpolates between them, which is what MoveIt produces.
#
# The gripper has two controllers, and only one of them is running at a time.
# Opening the fingers and closing them to a measured width is a position job.
# Holding a glass is not: what matters then is how hard the pads press, and a
# position controller cannot say that. So the task swaps to the effort
# controller once the pads are on the glass, and swaps back to let go.
# arm/motion.py does the swapping, through /controller_manager/switch_controller.
#
# Both gripper controllers drive a single joint, because a Robotiq 2F-85 has
# one motor. Its other joints follow that one through the linkage and are
# declared as mimic joints in Robotiq's description, so a controller must not
# be given them: they are not free to command.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wrist_force_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_force_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Closing on a glass always stops the fingers short of the position they
    # were asked for. That is contact, not a fault, so nothing is required of
    # where the fingers end up.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

gripper_force_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    # Newton metres at the knuckle, not newtons at the pads. arm/robotiq_2f85.py
    # converts, because the pads are what glasses/force.py reasons about.
    interface_name: effort

wrist_force_broadcaster:
  ros__parameters:
    sensor_name: wrist_force
    # The reading is in the sensor's own frame, which is turned the same way as
    # the gripper, so its z axis is the direction the gripper reaches in. A
    # glass hanging below the fingers pulls along it.
    frame_id: force_sensor_link
    # The topic is not set here. This broadcaster has no topic_name parameter
    # and always publishes on ~/wrench, so the launch remaps it to /wrist_force.
