# How MoveIt hands a planned trajectory to whatever is driving the joints.
# Both controllers are the standard ros2_control trajectory controller, so
# MoveIt talks to them over the same action either way.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      # One joint, because a Robotiq 2F-85 has one motor. Its other joints
      # mimic this one and are not free to command.
      - robotiq_85_left_knuckle_joint

trajectory_execution:
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02
