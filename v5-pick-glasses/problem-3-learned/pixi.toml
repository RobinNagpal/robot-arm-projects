[workspace]
name = "pick-glasses-push-learned"
version = "0.1.0"
description = "Problem 3 learned: a forward model of pushes, trained in a physics engine, and a planner that searches against it"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Its own environment, apart from the ROS one, as in problem-2-learned.
[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pytorch = ">=2.3"
# rack/layout.py imports OpenCV, and the glass zone is read from there.
py-opencv = ">=4.9"
pytest = ">=7"

# The physics engine the pushes happen in. From PyPI, as in v5-learn-pick-place.
[pypi-dependencies]
mujoco = ">=3.3"

[activation.env]
# The project's own modules, and the scenes, physics and scoring shared with
# problem-3-programmed.
PYTHONPATH = "$PIXI_PROJECT_ROOT/../src/work_cell:$PIXI_PROJECT_ROOT/../problem-3-sim"
PYTORCH_ENABLE_MPS_FALLBACK = "1"
