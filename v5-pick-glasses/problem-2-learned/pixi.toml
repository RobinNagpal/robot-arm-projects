[workspace]
name = "pick-glasses-learned"
version = "0.1.0"
description = "Problem 2 with learned parts: find glasses from above, rank side viewpoints, read a profile from a side picture"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Its own environment, apart from the ROS one. Nothing here talks to ROS, and
# PyTorch beside RoboStack's libraries is a conflict not worth having.
[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pytorch = ">=2.3"
# rack/layout.py imports OpenCV, and the glass zone is read from there.
py-opencv = ">=4.9"
pytest = ">=7"

[activation.env]
# The project's own modules (shapes, spawn, profile, perception, dimensions),
# and the scenes and scoring shared with problem-2-programmed.
PYTHONPATH = "$PIXI_PROJECT_ROOT/../src/work_cell:$PIXI_PROJECT_ROOT/../problem-2-sim"
PYTORCH_ENABLE_MPS_FALLBACK = "1"
